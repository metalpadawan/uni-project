services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smart_attend
      POSTGRES_USER: smart_attend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["5432:5432"]
    volumes:
      - smart_attend_db:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_attend -d smart_attend"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./api:/app"]
    environment:
      DATABASE_URL: postgresql+psycopg://smart_attend:${POSTGRES_PASSWORD:-local-development-only}@db:5432/smart_attend
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-development-only-change-me}
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret-change-before-deploy}
      DEMO_MODE: ${DEMO_MODE:-false}
      FACE_SERVICE_URL: http://face-service:8001
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports: ["8000:8000"]
    # `db` must be accepting connections, not just started, before the api container's
    # startup-time `Base.metadata.create_all()` call runs — plain depends_on only waits
    # for the container to start, which races Postgres's own init on a cold volume.
    depends_on:
      db:
        condition: service_healthy
      face-service:
        condition: service_started
  face-service:
    image: python:3.12-slim
    working_dir: /app
    # opencv-python-headless still needs a couple of system shared libraries on a bare
    # Debian slim image (libGL/libglib) despite the "headless" name — not needed for
    # face-service's own code, but for OpenCV's transitive dependencies.
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/* && pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    volumes: ["./face-service:/app"]
    environment:
      FACE_DISTANCE_THRESHOLD: ${FACE_DISTANCE_THRESHOLD:-1.128}
volumes:
  smart_attend_db:
