databases:
  - name: smartattend-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: smartattend-face-service
    runtime: docker
    dockerfilePath: ./face-service/Dockerfile
    dockerContext: ./face-service
    plan: free
    envVars:
      - key: FACE_DISTANCE_THRESHOLD
        value: "1.128"
      - key: FACE_MIN_FRAME_DIFFERENCE
        value: "6.0"

  - type: web
    name: smartattend-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartattend-db
          property: connectionString
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: QR_TTL_SECONDS
        value: "15"
      - key: FACE_DISTANCE_THRESHOLD
        value: "1.128"
      - key: FACE_SERVICE_URL
        value: "https://smartattend-face-service.onrender.com"
      - key: FACE_SERVICE_TIMEOUT_SECONDS
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "https://uni-project-drab.vercel.app"
      # Vercel deployment URLs include a changing suffix. This still permits
      # only deployments from this project/team, rather than arbitrary sites.
      - key: ALLOWED_ORIGIN_REGEX
        value: '^https://uni-project-[a-z0-9-]+-metalpadawans-projects\.vercel\.app$'
      - key: PUBLIC_FRONTEND_URL
        value: "https://uni-project-drab.vercel.app"
      - key: DEMO_MODE
        value: "false"
      - key: TIMEZONE
        value: "Africa/Lagos"
