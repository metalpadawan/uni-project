databases:
  - name: smartattend-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: smartattend-face-service
    runtime: docker
    dockerfilePath: ./face-service/Dockerfile
    dockerContext: ./face-service
    plan: free
    envVars:
      - key: FACE_DISTANCE_THRESHOLD
        value: "1.128"
      - key: FACE_MIN_FRAME_DIFFERENCE
        value: "6.0"

  - type: web
    name: smartattend-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartattend-db
          property: connectionString
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: QR_TTL_SECONDS
        value: "15"
      - key: FACE_DISTANCE_THRESHOLD
        value: "1.128"
      - key: FACE_SERVICE_URL
        # Render assigns a suffix to a service name, so set this to the actual
        # public URL of the face service in the Render dashboard.
        sync: false
      - key: FACE_SERVICE_TIMEOUT_SECONDS
        value: "60"
      - key: ALLOWED_ORIGINS
        # Set this to the single, stable Vercel production origin. Keeping an
        # explicit list is safer than allowing changing preview URLs broadly.
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: TIMEZONE
        value: "Africa/Lagos"
